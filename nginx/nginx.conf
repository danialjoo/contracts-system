user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;   # هماهنگ با سقف ۲۰ مگابایتی پیوست‌ها

    log_format internal '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log internal;

    # لایه دوم دفاع: فقط شبکه‌های خصوصی. لایه اول، bind شدن پورت روی
    # آدرس داخلی در compose است و لایه سوم، فایروال خود سرور.
    geo $is_internal {
        default        0;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        127.0.0.0/8    1;
    }

    upstream app { server app:8000; }

    server {
        listen 80 default_server;
        server_name _;
        charset utf-8;

        if ($is_internal = 0) { return 403; }

        # سامانه محرمانه است: نه ایندکس شود، نه در تاریخچه پروکسی بماند.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        location / {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /api/health {
            proxy_pass http://app;
            access_log off;
        }
    }
}
